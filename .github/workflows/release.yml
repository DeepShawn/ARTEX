name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apagent
          POSTGRES_PASSWORD: release-test-password
          POSTGRES_DB: apagent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apagent -d apagent_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APAGENT_PG_DSN: postgres://apagent:release-test-password@127.0.0.1:5432/apagent_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - name: Test backend with PostgreSQL
        run: go test -p 1 -timeout 20m ./...

  # Export the production frontend once; all binaries embed these same files.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
        env:
          NEXT_PUBLIC_MOCK: "0"
          NEXT_PUBLIC_BASE_PATH: ""
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out
          if-no-files-found: error

  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          APAGENT_TARGET_OS: ${{ matrix.goos }}
          APAGENT_TARGET_ARCH: ${{ matrix.goarch }}
          APAGENT_BUILD_VERSION: ${{ github.ref_name }}
          APAGENT_SKIP_FRONTEND: "1"
          # Avoid UPX self-extracting executables for portability.
          APAGENT_COMPRESS: "off"
          APAGENT_PACKAGE: "1"
          APAGENT_PACKAGE_DIR: dist
        run: ./build.sh --target "${APAGENT_TARGET_OS}/${APAGENT_TARGET_ARCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
          if-no-files-found: error
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/apagent-linux-${{ matrix.goarch }}/apagent
          if-no-files-found: error

  smoke:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apagent
          POSTGRES_PASSWORD: release-smoke-password
          POSTGRES_DB: apagent_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apagent -d apagent_smoke"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkg-linux-amd64
          path: dist
      - name: Smoke test packaged release with PostgreSQL
        env:
          APAGENT_PG_DSN: postgres://apagent:release-smoke-password@127.0.0.1:5432/apagent_smoke?sslmode=disable
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/smoke-release.sh "dist/apagent-${RELEASE_TAG#v}-linux-amd64.zip" "$RELEASE_TAG"

  release:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Verify packages and generate checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 5
          for archive in *.zip; do unzip -tq "$archive"; done
          sha256sum *.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Publish this repository's multi-architecture image without Docker Hub secrets.
  docker:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/deepshawn/artex
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
